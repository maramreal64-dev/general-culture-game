<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>لعبة الثقافة العامة</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#17152b,#30275c);
  color:white;
  min-height:100vh;
}
.container{
  width:min(92%,500px);
  margin:auto;
  padding:25px 0;
}
.card{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);
  border-radius:25px;
  padding:25px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
  backdrop-filter:blur(10px);
}
h1{
  text-align:center;
  margin-bottom:8px;
}
.subtitle{
  text-align:center;
  opacity:.75;
  margin-bottom:25px;
}
.stats{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}
.question{
  font-size:22px;
  font-weight:bold;
  line-height:1.6;
  margin:20px 0;
}
.answer{
  width:100%;
  padding:15px;
  margin:8px 0;
  border:0;
  border-radius:15px;
  background:#fff;
  color:#222;
  font-size:17px;
  cursor:pointer;
}
